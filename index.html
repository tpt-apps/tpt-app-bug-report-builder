<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TPT Bug Report Builder — TPT AppFront</title>
    <!-- data-wasm-opt="0" disables trunk's wasm-opt pass: the modern Rust
         wasm target emits bulk-memory opcodes that the cached Binaryen
         rejects, and the release profile (opt-level = "z", lto, strip)
         already keeps the payload small. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
    <!-- Matches src/app.rs's --brb-bg so the page behind the mounted app
         (visible in the margin around it, or before wasm finishes loading)
         doesn't stay browser-default white in dark mode. -->
    <style>
      html { color-scheme: light dark; background: #ffffff; }
      @media (prefers-color-scheme: dark) {
        html { background: #10151f; }
      }
      body { margin: 0; padding: 24px; }
    </style>
  </head>
  <body>
    <!-- Marker div: `start()` mounts here for standalone dev only; when the
         build is embedded in tptsolutions.co.nz/tools the hub runner calls
         `mount(container)` itself and this file is never served. -->
    <div id="tpt-appfront-root"></div>
  </body>
</html>
