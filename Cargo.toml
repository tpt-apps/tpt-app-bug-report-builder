[package]
name = "tpt-app-bug-report-builder"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [".", "engine", "desktop"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pro edition (paid desktop build): multi-screenshot sequences, scrolling-capture
# stitching, the auto-generated report assembler (Markdown + PDF) and the
# global-hotkey capture bindings. The free WASM build compiles without it.
pro = ["tpt-bugreport-engine/pro"]

[dependencies]
tpt-appfront-core = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-core" }
tpt-appfront-dom = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-dom" }
tpt-bugreport-engine = { path = "engine" }
# Pinned to the installed wasm-bindgen CLI version — the CLI rejects wasm
# built against a different schema version. Bump both together.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlHeadElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "HtmlImageElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "MediaStreamConstraints",
    "ImageData",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Navigator",
    "MediaStream",
    "MediaStreamTrack",
    "MediaDevices",
    "TextMetrics",
    "DomRect",
    "CssStyleDeclaration",
    "HtmlCollection",
    "NodeList",
] }
console_error_panic_hook = "0.1"
# Pro-only screen/scrolling capture (getDisplayMedia) needs to await JS
# promises; free-tier upload/paste stays sync and never touches this.
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The desktop shell is a native binary; keep its codegen normal even in the
# same workspace (the `release` profile above applies to the wasm lib build).
[profile.release.package.tpt-bugreport-desktop]
opt-level = 3